name: RemindMe
options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""

targets:
  RemindMe:
    type: application
    platform: iOS
    sources:
      - path: RemindMe
        excludes:
          - "Widget/**"
          - "Activities/RemindMeActivity.swift"
      - path: RemindMe/Activities/RemindMeAttributes.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.remindme.app
        INFOPLIST_FILE: RemindMe/SupportingFiles/Info.plist
        CODE_SIGN_ENTITLEMENTS: RemindMe/SupportingFiles/RemindMe.entitlements
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
    dependencies:
      - target: RemindMeWidget

  RemindMeWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: RemindMe/Widget
      - path: RemindMe/Activities
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.remindme.app.widget
        INFOPLIST_FILE: RemindMe/SupportingFiles/WidgetInfo.plist
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        NS_EXTENSION_POINT_IDENTIFIER: com.apple.widgetkit-extension
